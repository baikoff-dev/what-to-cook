name: what-to-cook

services:
  postgres:
    image: postgres:18.6-alpine
    restart: "on-failure:3"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-what_to_cook}
      POSTGRES_USER: ${POSTGRES_USER:-what_to_cook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-what_to_cook}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
